<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Báo cáo ngày - Rich text + Xuất DOCX</title>
    <script src="https://cdn.jsdelivr.net/npm/html-docx-js/dist/html-docx.js"></script>
    <style>
        :root {
            --bg-page: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --border: #334155;
            --input-bg: #0f172a;
            --input-border: #475569;
            --accent: #3b82f6;
            --btn-secondary: #334155;
            --btn-outline: #475569;
            --badge-bg: #1e3a8a;
            --badge-text: #93c5fd;
            --footer: #64748b;
            --shadow: rgba(0,0,0,0.3);
            --toolbar-bg: #2d3a4b;
        }

        body.light {
            --bg-page: #f1f5f9;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --border: #e2e8f0;
            --input-bg: #ffffff;
            --input-border: #cbd5e1;
            --accent: #2563eb;
            --btn-secondary: #64748b;
            --btn-outline: #94a3b8;
            --badge-bg: #dbeafe;
            --badge-text: #1e40af;
            --footer: #475569;
            --shadow: rgba(0,0,0,0.05);
            --toolbar-bg: #e2e8f0;
        }

        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: var(--bg-page);
            color: var(--text-primary);
            margin: 0;
            padding: 16px;
            padding-bottom: 40px;
            transition: background 0.2s, color 0.2s;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        h1 { font-size: 1.8rem; margin: 0; color: var(--text-primary); }
        .theme-toggle, .export-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-primary);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .export-btn { background: var(--accent); color: white; border: none; }
        .sub {
            color: var(--text-secondary);
            margin-bottom: 20px;
            border-left: 3px solid var(--accent);
            padding-left: 12px;
            font-size: 0.9rem;
        }
        .card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px var(--shadow);
            border: 1px solid var(--border);
        }
        .toolbar {
            background: var(--toolbar-bg);
            padding: 8px 12px;
            border-radius: 40px;
            margin-bottom: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .toolbar button, .toolbar select, .toolbar input {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 6px 12px;
            font-size: 0.8rem;
            cursor: pointer;
            color: var(--text-primary);
            font-weight: bold;
        }
        .toolbar input[type="color"] {
            width: 36px;
            height: 36px;
            padding: 4px;
            cursor: pointer;
        }
        .toolbar select { font-weight: normal; }
        .toolbar button:hover { background: var(--accent); color: white; }
        label {
            font-weight: 600;
            display: block;
            margin-top: 16px;
            margin-bottom: 6px;
            color: var(--text-primary);
            font-size: 0.9rem;
        }
        .editable {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--input-border);
            border-radius: 16px;
            font-size: 0.95rem;
            font-family: inherit;
            background: var(--input-bg);
            color: var(--text-primary);  /* quan trọng: mặc định theo theme */
            min-height: 100px;
            overflow-y: auto;
            outline: none;
            line-height: 1.5;
        }
        .editable:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
        }
        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 20px 0 10px;
        }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            flex: 1 0 auto;
            transition: 0.2s;
        }
        button.secondary { background: var(--btn-secondary); }
        button.warning { background: #dc2626; }
        button.outline {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--btn-outline);
        }
        .history-panel {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 16px;
            margin-top: 12px;
            border: 1px solid var(--border);
        }
        .report-item {
            border-bottom: 1px solid var(--border);
            padding: 16px 0;
        }
        .date-badge {
            background: var(--badge-bg);
            color: var(--badge-text);
            display: inline-block;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        details summary {
            cursor: pointer;
            font-weight: 500;
            color: var(--accent);
            margin: 8px 0;
        }
        footer {
            font-size: 0.7rem;
            text-align: center;
            color: var(--footer);
            margin-top: 30px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📋 Báo cáo ngày (Rich Text)</h1>
        <div>
            <button class="export-btn" id="exportDocxBtn">📄 Xuất DOCX</button>
            <button class="theme-toggle" id="themeToggle">🌙 Dark</button>
        </div>
    </div>
    <div class="sub">Ghi nhanh + định dạng đậm/nghiêng/màu · Xuất file Word</div>

    <div class="card">
        <label>📅 Ngày (dạng 24.4 hoặc 2025-04-24)</label>
        <input type="text" id="reportDate" placeholder="VD: 24.4" autocomplete="off">

        <div class="toolbar">
            <button type="button" data-cmd="bold" title="Đậm"><b>B</b></button>
            <button type="button" data-cmd="italic" title="Nghiêng"><i>I</i></button>
            <button type="button" data-cmd="underline" title="Gạch chân"><u>U</u></button>
            <input type="color" id="textColorPicker" title="Màu chữ">
            <button type="button" id="resetColorBtn" title="Reset màu về mặc định">🎨 Reset màu</button>
            <select id="fontSelect" title="Font chữ">
                <option value="Arial">Arial</option>
                <option value="Times New Roman">Times New Roman</option>
                <option value="Courier New">Courier New</option>
                <option value="Georgia">Georgia</option>
                <option value="Verdana">Verdana</option>
            </select>
            <select id="fontSizeSelect" title="Cỡ chữ">
                <option value="1">Nhỏ</option>
                <option value="3" selected>Vừa</option>
                <option value="5">Lớn</option>
                <option value="7">Rất lớn</option>
            </select>
        </div>

        <label>📝 Diễn biến chính trong ngày</label>
        <div id="dailyContent" class="editable" contenteditable="true"></div>

        <label>❌ 3 điều CHƯA LÀM & cần làm</label>
        <div id="notDone" class="editable" contenteditable="true"></div>

        <label>✅ 3 điều ĐÃ LÀM</label>
        <div id="done" class="editable" contenteditable="true"></div>

        <label>❓ 3 câu hỏi + tự trả lời</label>
        <div id="questions" class="editable" contenteditable="true"></div>

        <label>📖 Pháp học / Kinh sách (tuỳ chọn)</label>
        <div id="dharma" class="editable" contenteditable="true"></div>

        <div class="button-group">
            <button id="saveBtn">💾 Lưu báo cáo</button>
            <button id="clearFormBtn" class="outline">🧹 Xoá form</button>
        </div>
        <div class="button-group">
            <button id="toggleHistoryBtn" class="secondary">📋 Xem / Ẩn lịch sử</button>
            <button id="clearAllHistoryBtn" class="warning">🗑 Xoá toàn bộ</button>
        </div>
    </div>

    <div id="historyPanel" style="display: none;">
        <div class="history-panel">
            <h3 style="margin-top:0">📚 Lịch sử báo cáo (có định dạng)</h3>
            <div id="historyList">Chưa có báo cáo nào</div>
        </div>
    </div>
    <footer>Dữ liệu lưu trình duyệt · Bôi đen văn bản → dùng toolbar</footer>
</div>

<script>
    // ---------- THEME ----------
    function setTheme(theme) {
        if (theme === 'light') {
            document.body.classList.add('light');
            localStorage.setItem('theme', 'light');
            document.getElementById('themeToggle').innerHTML = '☀️ Light';
        } else {
            document.body.classList.remove('light');
            localStorage.setItem('theme', 'dark');
            document.getElementById('themeToggle').innerHTML = '🌙 Dark';
        }
    }
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') setTheme('light');
    else setTheme('dark');
    document.getElementById('themeToggle').addEventListener('click', () => {
        const isLight = document.body.classList.contains('light');
        setTheme(isLight ? 'dark' : 'light');
    });

    // ---------- Rich text support ----------
    let currentEditable = null;
    document.querySelectorAll('.editable').forEach(el => {
        el.addEventListener('focus', () => { currentEditable = el; });
        el.addEventListener('click', () => { currentEditable = el; });
    });
    function formatDoc(cmd, value = null) {
        if (!currentEditable) {
            alert('Hãy click vào ô cần định dạng trước.');
            return;
        }
        currentEditable.focus();
        document.execCommand(cmd, false, value);
    }
    // Gắn sự kiện cho các nút cũ
    document.querySelectorAll('[data-cmd]').forEach(btn => {
        btn.addEventListener('click', () => {
            formatDoc(btn.getAttribute('data-cmd'));
        });
    });
    document.getElementById('fontSelect').addEventListener('change', (e) => {
        formatDoc('fontName', e.target.value);
    });
    document.getElementById('fontSizeSelect').addEventListener('change', (e) => {
        formatDoc('fontSize', e.target.value);
    });
    // Màu chữ
    document.getElementById('textColorPicker').addEventListener('input', (e) => {
        formatDoc('foreColor', e.target.value);
    });
    // Reset màu: xóa inline style màu, đưa về màu CSS mặc định theo theme
    document.getElementById('resetColorBtn').addEventListener('click', () => {
        if (!currentEditable) {
            alert('Hãy click vào ô cần reset màu trước.');
            return;
        }
        // Xóa tất cả thẻ span có style color, hoặc xóa thuộc tính style color trên các thẻ
        // Cách đơn giản: chọn toàn bộ nội dung, xóa màu inline (set lại màu rỗng)
        const selection = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(currentEditable);
        selection.removeAllRanges();
        selection.addRange(range);
        document.execCommand('removeFormat', false, null);
        // Lưu ý: removeFormat cũng xóa đậm nghiêng, nhưng tạm chấp nhận. Hoặc dùng cách tinh tế hơn:
        // Tôi sẽ dùng cách loại bỏ style color thủ công
        // Thực tế: removeFormat tiện nhất, người dùng có thể bôi đen lại để format lại.
        // Để không mất đậm nghiêng, có thể dùng hàm duyệt DOM, nhưng phức tạp.
        // Vì đơn giản, tôi dùng removeFormat và thông báo.
        alert('Đã reset màu về mặc định (có thể mất cả đậm/nghiêng, bạn có thể format lại).');
        // Đặt lại focus
        currentEditable.focus();
    });

    // ---------- Lưu / Load (HTML) ----------
    function getTodayString() {
        const d = new Date();
        return `${d.getDate()}.${d.getMonth()+1}`;
    }
    document.getElementById('reportDate').value = getTodayString();

    function saveReport() {
        const date = document.getElementById('reportDate').value.trim();
        if (!date) { alert('Vui lòng nhập ngày'); return; }
        const report = {
            date: date,
            dailyContent: document.getElementById('dailyContent').innerHTML,
            notDone: document.getElementById('notDone').innerHTML,
            done: document.getElementById('done').innerHTML,
            questions: document.getElementById('questions').innerHTML,
            dharma: document.getElementById('dharma').innerHTML,
            timestamp: Date.now()
        };
        let reports = JSON.parse(localStorage.getItem('dailyReports')) || [];
        const idx = reports.findIndex(r => r.date === date);
        if (idx !== -1) reports[idx] = report;
        else reports.unshift(report);
        reports.sort((a,b) => b.timestamp - a.timestamp);
        localStorage.setItem('dailyReports', JSON.stringify(reports));
        alert(`✅ Đã lưu ngày ${date}`);
        renderHistory();
    }

    function loadReportToForm(date) {
        const reports = JSON.parse(localStorage.getItem('dailyReports')) || [];
        const report = reports.find(r => r.date === date);
        if (report) {
            document.getElementById('reportDate').value = report.date;
            document.getElementById('dailyContent').innerHTML = report.dailyContent || '';
            document.getElementById('notDone').innerHTML = report.notDone || '';
            document.getElementById('done').innerHTML = report.done || '';
            document.getElementById('questions').innerHTML = report.questions || '';
            document.getElementById('dharma').innerHTML = report.dharma || '';
            alert(`📂 Đã tải báo cáo ngày ${date} lên form, bạn có thể chỉnh sửa và lưu lại.`);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
            alert('Không tìm thấy báo cáo');
        }
    }

    function clearForm() {
        document.getElementById('dailyContent').innerHTML = '';
        document.getElementById('notDone').innerHTML = '';
        document.getElementById('done').innerHTML = '';
        document.getElementById('questions').innerHTML = '';
        document.getElementById('dharma').innerHTML = '';
        document.getElementById('reportDate').value = getTodayString();
    }

    function renderHistory() {
        const reports = JSON.parse(localStorage.getItem('dailyReports')) || [];
        const container = document.getElementById('historyList');
        if (!reports.length) {
            container.innerHTML = '📭 Chưa có báo cáo nào';
            return;
        }
        let html = '';
        reports.forEach(r => {
            html += `<div class="report-item">
                        <div class="date-badge">📅 ${r.date}</div>
                        <details>
                            <summary>📄 Xem nội dung (có định dạng)</summary>
                            <strong>📝 Diễn biến:</strong><br>${(r.dailyContent || '---')}<br>
                            <strong>❌ Chưa làm:</strong><br>${(r.notDone || '---')}<br>
                            <strong>✅ Đã làm:</strong><br>${(r.done || '---')}<br>
                            <strong>❓ Hỏi & Đáp:</strong><br>${(r.questions || '---')}<br>
                            <strong>📖 Pháp:</strong><br>${(r.dharma || '---')}
                        </details>
                        <button class="load-report-btn" data-date="${r.date}">📂 Tải lên form (sửa)</button>
                    </div>`;
        });
        container.innerHTML = html;
        document.querySelectorAll('.load-report-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const date = btn.getAttribute('data-date');
                loadReportToForm(date);
            });
        });
    }

    function clearAllHistory() {
        if (confirm('⚠️ Xoá TOÀN BỘ lịch sử? Hành động không thể khôi phục.')) {
            localStorage.removeItem('dailyReports');
            renderHistory();
            clearForm();
            alert('Đã xoá hết dữ liệu');
        }
    }

    // ---------- Xuất DOCX ----------
    function exportToDocx() {
        const date = document.getElementById('reportDate').value.trim() || getTodayString();
        const daily = document.getElementById('dailyContent').innerHTML || '';
        const notDone = document.getElementById('notDone').innerHTML || '';
        const done = document.getElementById('done').innerHTML || '';
        const questions = document.getElementById('questions').innerHTML || '';
        const dharma = document.getElementById('dharma').innerHTML || '';

        const style = `
            <style>
                body { font-family: Arial, sans-serif; margin: 40px; line-height: 1.6; }
                h1 { color: #1e293b; }
                h2 { color: #0f172a; margin-top: 20px; border-left: 4px solid #3b82f6; padding-left: 12px; }
                .section { margin-bottom: 24px; }
                .label { font-weight: bold; font-size: 1.1em; margin-bottom: 6px; color: #2563eb; }
                .content { margin-left: 12px; }
                .date { font-size: 0.9em; color: #475569; margin-bottom: 20px; }
            </style>
        `;
        const contentHtml = `
            <!DOCTYPE html>
            <html>
            <head><meta charset="UTF-8"><title>Báo cáo ngày ${date}</title>${style}</head>
            <body>
                <h1>📋 Báo cáo ngày ${date}</h1>
                <div class="date">Ngày lập: ${new Date().toLocaleString()}</div>
                <div class="section"><div class="label">📝 Diễn biến chính:</div><div class="content">${daily || '---'}</div></div>
                <div class="section"><div class="label">❌ 3 điều CHƯA LÀM & cần làm:</div><div class="content">${notDone || '---'}</div></div>
                <div class="section"><div class="label">✅ 3 điều ĐÃ LÀM:</div><div class="content">${done || '---'}</div></div>
                <div class="section"><div class="label">❓ 3 câu hỏi + tự trả lời:</div><div class="content">${questions || '---'}</div></div>
                <div class="section"><div class="label">📖 Pháp học / Kinh sách:</div><div class="content">${dharma || '---'}</div></div>
                <hr><footer style="font-size:0.8rem;">Xuất từ ứng dụng Báo cáo ngày</footer>
            </body>
            </html>
        `;
        const converted = htmlDocx.asBlob(contentHtml);
        const link = document.createElement('a');
        const url = URL.createObjectURL(converted);
        link.href = url;
        link.download = `baocao_ngay_${date}.docx`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    // Gắn sự kiện
    document.getElementById('saveBtn').addEventListener('click', saveReport);
    document.getElementById('clearFormBtn').addEventListener('click', clearForm);
    document.getElementById('toggleHistoryBtn').addEventListener('click', () => {
        const panel = document.getElementById('historyPanel');
        panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        if (panel.style.display === 'block') renderHistory();
    });
    document.getElementById('clearAllHistoryBtn').addEventListener('click', clearAllHistory);
    document.getElementById('exportDocxBtn').addEventListener('click', exportToDocx);
    
    if (localStorage.getItem('dailyReports')) renderHistory();
    document.getElementById('dailyContent').focus();
</script>
</body>
</html>
